version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dashboard_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: dashboard_pass
      POSTGRES_DB: dashboard_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
